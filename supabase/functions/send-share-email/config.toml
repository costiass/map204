# send-share-email
#
# `verify_jwt = false` on purpose, and it is not a hole.
#
# Supabase's gateway verifies the JWT *before* the function runs. That is a good
# default and this project leaves it on for everything else. It is wrong for a
# browser-facing function for two reasons:
#
#   1. A CORS preflight carries no `Authorization` header -- there is no credential
#      to verify yet -- so the gateway answers 401 to an `OPTIONS` the browser has to
#      make before it will send the real request. The email then fails with a CORS
#      error that names neither the cause nor the function.
#   2. The gateway checks that a token is *valid*. It does not check that the token's
#      user owns the workspace being named in the email. This function does, with the
#      service role key, on every call -- so turning the gateway check off is
#      replaced by a stronger check rather than by none.
#
# The function's own authorisation, in `index.ts`:
#
#   * `Authorization: Bearer <token>` must be present, and `auth.getUser()` must
#     resolve it, so an unauthenticated call is refused.
#   * `documents.owner_id` must equal the caller, or the caller must be an
#     `editor`/`owner` in `document_collaborators` for that workspace. A viewer --
#     somebody lent the map -- is refused, which is the same rule the RLS policy
#     applies to writes.
#
# A viewer being refused is the case that matters: without the ownership check this
# endpoint is an open relay, and any account could ask it to mail the contents of a
# map they were only lent to any address they liked.
[functions.send-share-email]
verify_jwt = false
