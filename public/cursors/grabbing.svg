<!--
  The "you are dragging" cursor: the same four-way move with the arms closed in,
  which is the universal signal that something is held.

  Hotspot is 12,12, the centre — the held thing stays under the pointer while the
  pointer moves, so the point you grabbed is the point you are looking at.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24">
  <g fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="4">
    <path d="M12 5v14" />
    <path d="m14.5 15.5-2.5 2.5-2.5-2.5" />
    <path d="m15.5 9.5 2.5 2.5-2.5 2.5" />
    <path d="M5 12h14" />
    <path d="m9.5 9.5-2.5 2.5 2.5 2.5" />
    <path d="m9.5 14.5 2.5-2.5 2.5 2.5" />
  </g>
  <g fill="none" stroke="#ffffff" stroke-linecap="round" stroke-linejoin="round" stroke-width="2">
    <path d="M12 5v14" />
    <path d="m14.5 15.5-2.5 2.5-2.5-2.5" />
    <path d="m15.5 9.5 2.5 2.5-2.5 2.5" />
    <path d="M5 12h14" />
    <path d="m9.5 9.5-2.5 2.5 2.5 2.5" />
    <path d="m9.5 14.5 2.5-2.5 2.5 2.5" />
  </g>
</svg>
