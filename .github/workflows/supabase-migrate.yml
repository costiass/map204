name: Supabase Migration

on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link Supabase project
        run: supabase link --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      # Every migration is written to be re-runnable (IF EXISTS / IF NOT EXISTS /
      # DROP POLICY IF EXISTS), so they are applied one by one in order rather
      # than through `supabase db push` — which refuses to run at all when a
      # relation from an earlier run already exists.
      - name: Apply migrations
        run: |
          set -euo pipefail
          for file in $(ls -1 supabase/migrations/*.sql | sort); do
            echo "::group::$file"
            supabase db query --linked --file "$file"
            echo "::endgroup::"
            # Record it, so the Supabase dashboard history matches the files.
            version="$(basename "$file" | cut -d_ -f1)"
            name="$(basename "$file" .sql | cut -d_ -f2-)"
            supabase db query --linked \
              "insert into supabase_migrations.schema_migrations (version, name)
               values ('${version}', '${name}')
               on conflict (version) do nothing;"
          done

        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
